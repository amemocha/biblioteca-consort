name: Construir APK Biblioteca Consorte
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK para Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Identificar SDK Android del runner
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" && test -d "$SDK_ROOT" || { echo "ANDROID_SDK_ROOT no disponible"; exit 1; }
          echo "sdk.dir=$SDK_ROOT" > android/local.properties
          echo "Plataformas disponibles:"
          ls -lah "$SDK_ROOT/platforms" || true
          echo "Herramientas de compilacion:"
          ls -lah "$SDK_ROOT/build-tools" || true
      - name: Preparar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Copiar interfaz completa a la app
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/index.html
      - name: Compilar APK de prueba
        working-directory: android
        shell: bash
        run: |
          gradle --no-daemon --stacktrace --info :app:assembleDebug
      - name: Guardar registros de diagnostico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Biblioteca-Consorte-Errores-Gradle
          path: |
            android/app/build/reports/**
            android/app/build/outputs/logs/**
            android/.gradle/**
          if-no-files-found: ignore
      - name: Publicar APK para descargar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Biblioteca-Consorte-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
